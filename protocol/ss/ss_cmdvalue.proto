syntax = "proto3";

option go_package = "gamekit/pkg/ss;ss";
package ss;

// 服务间协议命令字枚举
// 新增服务间协议时在此注册 ECV_SS*Req / ECV_SS*Res，并在对应 ss_*.proto 中定义消息体
enum EnmCmdValue
{
	ECV_Init = 0;

	// gamesvr 启动向 relaysvr 注册
	ECV_SSRegistReq = 3000001;
	ECV_SSRegistRes = 3000002;

	// 服务之间的心跳包
	ECV_SSHeartReq = 3000003;
	ECV_SSHeartRes = 3000004;

	// 封号
	ECV_SSForbidAccountNotify = 3000148;

	// misc 相关协议
	ECV_SSMiscReq = 3000022;
	ECV_SSMiscRes = 3000023;

	// 透传协议，不需要有 res
	ECV_SSTransReq = 3000024;

	// 测试连通性
	ECV_SSTransTestReq = 3000154;
	ECV_SSTransTestRes = 3000155;

	// 获取 relaysvr 注册的所有服务
	ECV_SSGetAllServiceReq = 3000158;
	ECV_SSGetAllServiceRes = 3000159;

	// 踢所有人下线通知
	ECV_SSKickOffAllNotify = 3100009;

	// GM命令通知
	ECV_SSGMCommandNotify = 3100010;
}
